// Select one or more measures in the tree, then run.

foreach (var m in Selected.Measures)
{
    var baseRef = m.DaxObjectName;  // e.g. [Total Sales]
    var folder  = string.IsNullOrEmpty(m.DisplayFolder) 
        ? "Time Intel" 
        : m.DisplayFolder + "\\\\Time Intel";

    // YTD
    var ytd = m.Table.AddMeasure(
        m.Name + " YTD",
        "CALCULATE(" + baseRef + ", DATESYTD(DimDate[Date]))"
    );
    ytd.FormatString  = m.FormatString;
    ytd.DisplayFolder = folder;

    // Prior Year
    var py = m.Table.AddMeasure(
        m.Name + " PY",
        "CALCULATE(" + baseRef + ", SAMEPERIODLASTYEAR(DimDate[Date]))"
    );
    py.FormatString  = m.FormatString;
    py.DisplayFolder = folder;

    // YoY %
    var yoy = m.Table.AddMeasure(
        m.Name + " YoY %",
        "DIVIDE(" + baseRef + " - [" + m.Name + " PY], [" + m.Name + " PY])"
    );
    yoy.FormatString  = "0.0%;-0.0%;\\"\\"";
    yoy.DisplayFolder = folder;
}`},{id:"te-fmtbytype",title:"Auto-Set Format Strings",desc:"Detects format from measure name keywords. % stays %, count stays integer, everything else gets thousand separators with 2 decimals",tags:["bulk","formatting"],lang:"csharp",code:`// Sets format string on measures that have none.
// Only touches blanks, won't overwrite custom formats.

foreach (var m in Model.AllMeasures)
{
    if (!string.IsNullOrEmpty(m.FormatString)) continue;
    
    var n = m.Name.ToLower();
    
    if (n.Contains("%") || n.Contains("percent") || n.Contains("ratio") || n.Contains("margin"))
        m.FormatString = "0.0%;-0.0%;\\"\\"";
    else if (n.Contains("count") || n.Contains(" #") || n.StartsWith("#"))
        m.FormatString = "#,0";
    else if (n.Contains("avg") || n.Contains("average"))
        m.FormatString = "#,0.00";
    else
        m.FormatString = "#,0";  // default: integer with separators

("Applied " + fixCount + " fixes.").Output();`},{id:"te-cgtime",title:"Generate Time Intel Calc Group",desc:"Creates a Time Intelligence calculation group with Current/YTD/QTD/MTD/PY/YoY items. One calc group replaces dozens of measure variants. Replace DimDate[Date] with your date table. Items appear as ROWS of the group's Name column (slicer, filter pane, Model explorer), not as fields in the Data pane",tags:["calc-group","high-value"],lang:"csharp",code:`// PBI Toolkit build 2026-07-20e
// Builds a complete time intelligence calculation group.

// Idempotent: rerun updates items in place.

try {
var existing = Model.Tables
    .FirstOrDefault(t => t.Name == "Time Intelligence");

{
    Error("A regular table named 'Time Intelligence' exists. Rename or delete it, then rerun.");
    return;
}
if (cg == null)
    cg = Model.AddCalculationGroup("Time Intelligence");

// Define items as (name, expression, formatString)
var items = new[] {
    new { N = "Current", E = "SELECTEDMEASURE()", F = "" },
    new { N = "YTD",     E = "CALCULATE(SELECTEDMEASURE(), DATESYTD(DimDate[Date]))", F = "" },
    new { N = "QTD",     E = "CALCULATE(SELECTEDMEASURE(), DATESQTD(DimDate[Date]))", F = "" },
    new { N = "MTD",     E = "CALCULATE(SELECTEDMEASURE(), DATESMTD(DimDate[Date]))", F = "" },
    new { N = "PY",      E = "CALCULATE(SELECTEDMEASURE(), SAMEPERIODLASTYEAR(DimDate[Date]))", F = "" },
    new { N = "YoY $",   E = "SELECTEDMEASURE() - CALCULATE(SELECTEDMEASURE(), SAMEPERIODLASTYEAR(DimDate[Date]))", F = "+#,0;-#,0;0" },
    new { N = "YoY %",   
          E = "VAR C = SELECTEDMEASURE() VAR P = CALCULATE(SELECTEDMEASURE(), SAMEPERIODLASTYEAR(DimDate[Date])) RETURN DIVIDE(C - P, P)", 
          F = "+0.0%;-0.0%;0.0%" }
};

int ord = 0, made = 0, upd = 0;
foreach (var item in items)
{
    var ci = cg.CalculationItems
        .FirstOrDefault(x => x.Name == item.N);
    if (ci == null)
    {
        ci = cg.AddCalculationItem(item.N, item.E);

    ci.Ordinal = ord++;
    if (!string.IsNullOrEmpty(item.F))
        ci.FormatStringExpression = "\\"" + item.F + "\\"";

    + " created, " + upd + " updated, "

AvailableInMDX to false on non-attribute columns",fix:"On hidden columns, set IsAvailableInMDX = false. Speeds up XMLA endpoint and saves memory. Use a TE script to bulk-set.",category:"Performance"},{name:"Set SummarizeBy = None for non-aggregatable columns",fix:"Keys, identifiers, codes should never sum. Set SummarizeBy property to None. The bulk BPA fix script handles this.",category:"Modeling"},{name:"Hide foreign key columns",fix:"Any column ending in Key/ID joining to a dim should be IsHidden = true. Users have no reason to see surrogate keys.",category:"Modeling"},{name:"Provide format strings for measures",fix:"Every measure should have a FormatString. Currency, percent, integer. Default '#,0' beats nothing.",category:"Formatting"},{name:"Use DIVIDE instead of /",fix:"DIVIDE handles divide-by-zero and returns BLANK or your alternate. The / operator returns infinity errors that break visuals.",category:"DAX"},{name:"Avoid IFERROR",fix:"IFERROR forces a row-by-row context and disables optimizations. Use DIVIDE, ISBLANK, or IF with explicit conditions instead.",category:"DAX"},{name:"Use the COUNTROWS function over COUNT",fix:"COUNTROWS counts rows. COUNT counts non-null values of one column. COUNTROWS is faster and clearer when you mean 'how many rows'.",category:"DAX"},{name:"Avoid calculated columns where measures would work",fix:"Calc columns cost RAM (computed at refresh, stored). Measures compute at query time. Use calc columns only for slicers, relationships, or hierarchies.",category:"Performance"},{name:"Reduce usage of calculated tables",fix:"Calc tables fragment the model and can't be incrementally refreshed. Push the logic to Power Query or the source.",category:"Performance"},{name:"Avoid RELATED in calculated columns of a fact table",fix:"Pulling dim attributes into the fact via RELATED bloats compression. Keep dims separate. Use the relationship at query time via DAX.",category:"Performance"},{name:"Provide descriptions on measures and tables",fix:"Description property shows on hover in Desktop and gets indexed by Copilot. Two-sentence minimum: what it returns and the grain.",category:"Documentation"}],xg=[{section:"Performance Debug Workflow",intro:"Step-by-step to find and fix slow visuals. Use this any time a visual takes more than 500ms. The whole loop is 5 to 15 minutes once you've done it twice.",items:[{kind:"step",num:"1",title:"Enable Performance Analyzer in Desktop",body:"View ribbon > Performance Analyzer > Start recording. Refresh visuals or click around the page. Each visual reports DAX query time, visual display time, and other. Anything above 500ms is slow, above 2s is bad, above 5s is critical. Click the row to expand and use Copy query to grab the generated DAX."},{kind:"step",num:"2",title:"Open DAX Studio, connect to the model",body:"External Tools ribbon > DAX Studio (if you registered it). Otherwise open DAX Studio standalone > File > Connect > pick the Power BI Desktop instance. Connects to the running Desktop session, no credentials needed."},{kind:"step",num:"3",title:"Enable Server Timings and clear cache",body:"Home ribbon > Clear Cache (force fresh run, do this before every measurement). Home ribbon > Server Timings toggle (turns on capture). Optional: Query Plan tab for logical and physical plan details. Paste the query, hit F5."},{kind:"step",num:"4",title:"Read SE vs FE time",body:"Server Timings shows the breakdown. SE (Storage Engine) is data retrieval, fast and multi-threaded. FE (Formula Engine) is computation, single-threaded and slow. Healthy ratio is roughly 80% SE, 20% FE. Total time goal: under 200ms for interactive visuals."},{kind:"code",title:"Optimization decision tree",code:`Symptom                          Cause                       Fix
